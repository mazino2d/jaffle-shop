name: Docker image

on:
  pull_request:
    branches:
      - main
    paths:
      - "dag/**"
      - "dbt/**"
      - "dlt/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  push:
    branches:
      - main
    paths:
      - "dag/**"
      - "dbt/**"
      - "dlt/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jaffle-shop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Dagster definitions
        run: docker run --rm jaffle-shop:ci dagster definitions validate -m dag

      # Runs execute in this image and load the Postgres-backed instance storage
      - name: Check instance storage dependencies
        run: docker run --rm jaffle-shop:ci python -c "import dagster_postgres"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # dev deploys every image pushed from main; stg/prod tags are bumped by hand in everything-as-code
  bump-dev:
    name: Bump dev image tag
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: bump-dev
      cancel-in-progress: false
    env:
      VALUES_FILE: kubernetes/clusters/mazino2d-as-se1-dev/apps/dagster/values.yaml

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.EAC_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.EAC_DEPLOYER_PRIVATE_KEY }}
          owner: mazino2d
          repositories: everything-as-code

      - uses: actions/checkout@v4
        with:
          repository: mazino2d/everything-as-code
          token: ${{ steps.app-token.outputs.token }}

      - name: Update image tag
        id: tag
        run: |
          tag="sha-${GITHUB_SHA::7}"
          sed -i "\|repository: ghcr.io/${{ github.repository }}|,\|tag:| s|tag: .*|tag: ${tag}|" "$VALUES_FILE"
          grep -q "tag: ${tag}" "$VALUES_FILE"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bump/jaffle-shop-dev
          title: "chore: bump jaffle-shop dev image to ${{ steps.tag.outputs.tag }}"
          commit-message: "chore: bump jaffle-shop dev image to ${{ steps.tag.outputs.tag }}"
          body: |
            Automated bump from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}.
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --repo mazino2d/everything-as-code --squash --auto
